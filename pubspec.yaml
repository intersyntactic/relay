  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_docking_station_api: ^0.7.0
  is_logbook_client: ^0.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
